<!-- fdt-widgets v1.1.0: Indice di Agilità Strategica (IAS). In data-sitekey va la site key pubblica di Turnstile. -->
<script>
/* Attribuzione: deve girare PRIMA di Umami. Legge utm_* e fdt_cid dall'URL,
   li ricorda per la sessione (no cookie: TRACCIAMENTO-E-IDENTITA.md §5.5)
   e toglie fdt_cid dalla barra degli indirizzi (non deve finire in Umami). */
(function () {
  var CHIAVI = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "fdt_cid"];
  var memo = {};
  try { memo = JSON.parse(sessionStorage.getItem("fdt-attr") || "{}"); } catch (e) {}
  try {
    var url = new URL(location.href);
    // Si scrivono tutti e 5 insieme solo se arriva qualcosa: mai mescolare due visite
    if (CHIAVI.some(function (k) { return url.searchParams.get(k); })) {
      memo = {};
      CHIAVI.forEach(function (k) { var v = url.searchParams.get(k); if (v) memo[k] = v.slice(0, 200); });
    }
    if (url.searchParams.has("fdt_cid")) {
      url.searchParams.delete("fdt_cid");
      history.replaceState(history.state, "", url.pathname + url.search + url.hash);
    }
  } catch (e) {}
  try { sessionStorage.setItem("fdt-attr", JSON.stringify(memo)); } catch (e) {}
})();
</script>
<div id="ias-widget" data-sitekey="__TURNSTILE_SITE_KEY__"></div>
<script src="https://cdn.jsdelivr.net/gh/fattoria-dei-talenti/fdt-widgets@v1.1.0/dist/ias.min.js" defer></script>
