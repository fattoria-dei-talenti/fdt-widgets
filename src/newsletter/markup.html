<!-- Widget newsletter: solo email (decisione D2, CONTRATTO.md). Lo inserisce widget.js nel contenitore #fdt-newsletter -->
<form class="nl-form" id="nl-form" novalidate>
  <div class="nl-campi" id="nl-campi">
    <div class="nl-riga">
      <label class="nl-etichetta" for="nl-email">Email</label>
      <input class="nl-input" id="nl-email" name="email" type="email" inputmode="email" autocomplete="email"
             autocapitalize="off" spellcheck="false" placeholder="nome@azienda.it" required aria-describedby="nl-email-err">
      <p class="nl-errore-campo" id="nl-email-err"></p>
    </div>
    <!-- Honeypot: invisibile alle persone, compilato dai bot. Stesso nome del widget IAS -->
    <div class="nl-hp" aria-hidden="true"><label for="nl-sito">Sito web</label><input type="text" id="nl-sito" name="sito_web" tabindex="-1" autocomplete="off"></div>
    <div class="nl-riga">
      <label class="nl-privacy"><input type="checkbox" id="nl-privacy" name="privacy" required aria-describedby="nl-privacy-err">
        <span>Ho letto l'<a href="https://www.fattoriadeitalenti.it/privacy-policy/" target="_blank" rel="noopener">informativa sulla privacy</a></span></label>
      <p class="nl-errore-campo" id="nl-privacy-err"></p>
    </div>
    <!-- Turnstile: si carica al primo tocco del campo email (D5), in modalità "solo se serve" -->
    <div class="nl-turnstile" id="nl-turnstile"></div>
    <button type="submit" class="nl-cta" id="nl-invia">Iscriviti alla newsletter</button>
  </div>
  <p class="nl-stato" id="nl-stato" role="status" aria-live="polite"></p>
</form>
